[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqcdepth"
version = "0.1.0"
description = "Estudo empirico controlado da profundidade de VQCs vs. MLP classica (ERAMIA-RS 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Timm Buss", email = "eduardotimmbus@gmail.com" }]
license = { text = "MIT" }

[project.scripts]
vqcdepth = "vqcdepth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
