[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqcdepth"
version = "0.1.0"
description = "Controlled empirical study of circuit depth in variational quantum classifiers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eduardo Timm Buss" }]
license = { text = "MIT" }
keywords = ["quantum-machine-learning", "variational-quantum-classifier",
            "pennylane", "quantum-computing", "reproducible-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
vqcdepth = "vqcdepth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
